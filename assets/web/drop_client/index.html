<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Erebrus Drop</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --panel: #111111;
      --panel-soft: #1b1b1b;
      --panel-hover: #252525;
      --line: #353535;
      --line-soft: rgba(255, 255, 255, 0.11);
      --text: #ffffff;
      --muted: #b8b8b8;
      --faint: #7a7a7a;
      --accent: #ff6a2a;
      --accent-deep: #c93e16;
      --green: #3fd475;
      --amber: #ffb14a;
      --red: #f25b5b;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.42);
      --nav-h: 64px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(150deg, rgba(255, 106, 42, 0.12) 0%, rgba(255, 106, 42, 0.035) 28%, transparent 58%),
        #050505;
      color: var(--text);
      -webkit-text-size-adjust: 100%;
    }

    body { min-height: 100vh; min-height: 100dvh; }
    button, input, textarea { font: inherit; }
    button, a, label { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-decoration: none; }

    button, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 10px;
      min-height: 44px;
      padding: 0 14px;
      background: var(--panel-soft);
      color: var(--text);
      cursor: pointer;
      font-weight: 650;
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease, opacity 140ms ease;
      user-select: none;
    }

    @media (hover: hover) {
      button:hover, .btn:hover { background: var(--panel-hover); }
      .primary:hover { background: linear-gradient(135deg, #ff7a40, var(--accent-deep)); }
    }
    button:active, .btn:active { transform: scale(0.97); }
    button:disabled { cursor: not-allowed; opacity: 0.45; transform: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #050505;
      font-weight: 800;
    }

    .ghost { background: transparent; border: 1px solid var(--line-soft); }
    .danger { background: rgba(242, 91, 91, 0.16); color: #ffbaba; }

    .icon-btn {
      width: 44px;
      min-width: 44px;
      padding: 0;
      border: 1px solid var(--line-soft);
    }

    .icon-btn.primary { border: 0; }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #141414;
      color: var(--text);
      padding: 12px 13px;
      outline: none;
      font-size: 16px; /* keeps iOS Safari from zooming on focus */
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 106, 42, 0.16);
    }

    textarea { min-height: 170px; resize: vertical; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(30px, 4vw, 44px); line-height: 1.05; letter-spacing: 0; margin-bottom: 6px; }
    h2 { font-size: clamp(24px, 3vw, 32px); margin-bottom: 2px; letter-spacing: 0; }
    h3 { font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .hidden { display: none !important; }
    .error { color: #ffbaba; }

    /* ---------- Login ---------- */
    .login-shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login {
      width: min(440px, 100%);
      border: 1px solid var(--line-soft);
      border-radius: 14px;
      background: rgba(17, 17, 17, 0.9);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-text { min-width: 0; }
    .brand-text strong, .brand-text div {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 10px 26px rgba(255, 106, 42, 0.24);
      flex: 0 0 auto;
    }

    /* ---------- Shell ---------- */
    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 256px minmax(0, 1fr) 300px;
    }

    .sidebar, .inspector {
      background: rgba(13, 13, 13, 0.86);
      backdrop-filter: blur(22px);
      padding: 22px;
    }

    .sidebar { border-right: 1px solid var(--line-soft); }
    .inspector { border-left: 1px solid var(--line-soft); display: grid; gap: 14px; align-content: start; }
    main { padding: 24px; min-width: 0; }

    .tabs { display: grid; gap: 6px; margin-top: 26px; }

    .tab {
      justify-content: flex-start;
      gap: 10px;
      text-align: left;
      padding: 0 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
    }

    .tab.active {
      background: rgba(255, 106, 42, 0.14);
      border-color: rgba(255, 106, 42, 0.34);
      color: var(--accent);
    }

    .folder-list { display: grid; gap: 4px; margin-top: 24px; }
    .folder-list h3 { margin-bottom: 6px; }

    .folder-link {
      justify-content: flex-start;
      gap: 9px;
      min-height: 38px;
      padding: 0 8px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
    }

    .mobile-bar, .bottom-nav, .fab { display: none; }

    .view-head {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--faint);
      min-height: 36px;
      overflow-x: auto;
      scrollbar-width: none;
      white-space: nowrap;
    }
    .breadcrumbs::-webkit-scrollbar { display: none; }

    .crumb-button {
      flex: 0 0 auto;
      min-height: 32px;
      padding: 0 10px;
      background: transparent;
      color: var(--accent);
      border: 1px solid rgba(255, 106, 42, 0.28);
      font-weight: 650;
    }

    .crumb-button.current { color: var(--text); border-color: var(--line-soft); }

    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .panel {
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      background: rgba(17, 17, 17, 0.82);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.16);
      overflow: hidden;
    }

    .panel-pad { padding: 16px; }
    .stack { display: grid; gap: 14px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .split { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }

    /* ---------- File list ---------- */
    .file-row {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) 100px 90px 104px;
      align-items: center;
      min-height: 64px;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line-soft);
    }

    .file-row.header {
      min-height: 42px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      text-transform: uppercase;
    }

    .file-row[data-row] { cursor: pointer; }
    @media (hover: hover) {
      .file-row[data-row]:hover { background: rgba(255, 106, 42, 0.07); }
    }
    .file-row.selected { background: rgba(255, 106, 42, 0.12); }
    .file-row:last-child { border-bottom: 0; }

    .select-btn {
      width: 28px;
      min-width: 28px;
      height: 28px;
      min-height: 28px;
      padding: 0;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.025);
    }

    .select-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      border-color: transparent;
      color: #050505;
    }

    .select-placeholder { width: 28px; height: 28px; display: block; }

    .file-main { display: flex; align-items: center; gap: 12px; min-width: 0; }

    .file-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(255, 106, 42, 0.13);
      color: var(--accent);
      flex: 0 0 auto;
    }

    .file-icon.folder { background: rgba(255, 177, 74, 0.13); color: var(--amber); }

    .file-meta { min-width: 0; }
    .file-title {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-weight: 700;
    }

    .file-subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--line-soft);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.035);
      font-size: 13px;
      font-weight: 600;
      width: max-content;
      max-width: 100%;
      white-space: nowrap;
    }

    .pill.warn { color: var(--amber); border-color: rgba(255, 177, 74, 0.4); }
    .pill.bad { color: #ffbaba; border-color: rgba(242, 91, 91, 0.4); }

    .actions { display: flex; justify-content: flex-end; gap: 7px; }

    .selection-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid rgba(255, 106, 42, 0.34);
      border-radius: 12px;
      background: rgba(30, 16, 10, 0.96);
      padding: 10px 12px;
    }

    .new-folder { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; }

    .empty {
      display: grid;
      place-items: center;
      gap: 12px;
      min-height: 240px;
      text-align: center;
      color: var(--muted);
      padding: 28px;
    }

    /* ---------- Upload ---------- */
    .pick-card {
      display: grid;
      place-items: center;
      gap: 10px;
      min-height: 220px;
      border: 1.5px dashed rgba(255, 106, 42, 0.55);
      border-radius: 16px;
      background: rgba(255, 106, 42, 0.07);
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
    }

    .pick-card:active { transform: scale(0.99); }
    @media (hover: hover) { .pick-card:hover { background: rgba(255, 106, 42, 0.11); } }
    .pick-card.dragging, body.dragging .pick-card { border-color: var(--green); background: rgba(32, 210, 123, 0.09); }
    .pick-card.busy { opacity: 0.55; pointer-events: none; }

    .pick-icon {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #050505;
    }

    .pick-icon svg { width: 28px; height: 28px; stroke-width: 2.4; }
    .pick-title { font-size: 20px; font-weight: 800; }

    .target-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); }
    .target-chip { min-height: 34px; padding: 0 12px; border: 1px solid var(--line-soft); font-weight: 650; max-width: 100%; }
    .target-chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .notice {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line-soft);
      background: rgba(255, 255, 255, 0.04);
      line-height: 1.4;
    }

    .notice svg { flex: 0 0 auto; margin-top: 1px; }
    .notice.bad { border-color: rgba(242, 91, 91, 0.45); background: rgba(242, 91, 91, 0.1); color: #ffd1d1; }
    .notice.good { border-color: rgba(63, 212, 117, 0.4); background: rgba(63, 212, 117, 0.08); color: #c8f7d8; }

    .transfer-card {
      border: 1px solid rgba(255, 106, 42, 0.34);
      border-radius: 12px;
      background: rgba(255, 106, 42, 0.1);
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .transfer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 800; }
    .transfer-head span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .progress-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--green));
      transition: width 160ms ease;
    }

    .queue { display: grid; gap: 6px; }
    .queue-item {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line-soft);
      font-size: 14px;
    }

    .queue-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-item.done { color: var(--muted); }
    .queue-item.done svg { color: var(--green); }
    .queue-item.failed svg { color: var(--red); }
    .queue-item.active svg { color: var(--accent); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Media ---------- */
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }

    .media-card {
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      background: rgba(17, 17, 17, 0.82);
      padding: 12px;
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .media-card video { width: 100%; max-height: 260px; border-radius: 8px; background: #000; }
    .media-card audio { width: 100%; }
    .media-card strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ---------- Inspector ---------- */
    .storage-ring {
      --pct: 0deg;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      margin: 4px auto 6px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, #111111 0 58%, transparent 59%),
        conic-gradient(var(--accent) var(--pct), rgba(255, 255, 255, 0.08) 0);
      border: 1px solid var(--line-soft);
    }

    .storage-number { display: grid; text-align: center; font-weight: 900; font-size: 22px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px; background: rgba(255, 255, 255, 0.035); min-width: 0; }
    .stat b { display: block; margin-bottom: 2px; }
    .stat span { font-size: 13px; }
    .activity { display: grid; gap: 10px; }
    .activity-item { display: flex; gap: 9px; align-items: center; color: var(--muted); font-size: 13px; }
    .activity-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .view { min-width: 0; }

    /* ---------- Toast & drop overlay ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);
      max-width: min(92vw, 460px);
      padding: 12px 16px;
      border-radius: 12px;
      background: #1f1f1f;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      font-weight: 650;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      z-index: 50;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.bad { border-color: rgba(242, 91, 91, 0.5); color: #ffd1d1; }

    .drop-overlay {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(5, 5, 5, 0.78);
      border: 3px dashed var(--green);
      z-index: 40;
      font-size: 22px;
      font-weight: 800;
      pointer-events: none;
    }

    body.dragging .drop-overlay { display: grid; }

    svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex: 0 0 auto;
    }

    @media (max-width: 1080px) {
      .shell { grid-template-columns: 220px minmax(0, 1fr); }
      .inspector {
        grid-column: 1 / -1;
        border-left: 0;
        border-top: 1px solid var(--line-soft);
        grid-template-columns: 1fr 1fr;
      }
    }

    /* ---------- Phones ---------- */
    @media (max-width: 780px) {
      .shell { display: block; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px); }
      .sidebar, .inspector, .file-row.header, .desktop-only { display: none !important; }

      .mobile-bar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 16px;
        padding-top: max(10px, env(safe-area-inset-top, 0px));
        background: rgba(8, 8, 8, 0.88);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-bottom: 1px solid var(--line-soft);
      }

      .mobile-bar .mark { width: 36px; height: 36px; border-radius: 10px; }
      .mobile-bar .brand-text div { font-size: 12px; }
      .mobile-bar .icon-btn { width: 40px; min-width: 40px; min-height: 40px; }

      main { padding: 16px; }
      h2 { font-size: 26px; }

      .bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        height: calc(var(--nav-h) + var(--safe-bottom));
        padding-bottom: var(--safe-bottom);
        background: rgba(10, 10, 10, 0.94);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-top: 1px solid var(--line-soft);
      }

      .bottom-nav button {
        flex-direction: column;
        gap: 3px;
        min-height: 0;
        height: var(--nav-h);
        border-radius: 0;
        background: transparent;
        color: var(--faint);
        font-size: 12px;
        font-weight: 700;
      }

      .bottom-nav button.active { color: var(--accent); }
      .bottom-nav svg { width: 22px; height: 22px; }

      .fab {
        position: fixed;
        right: 16px;
        bottom: calc(var(--nav-h) + var(--safe-bottom) + 14px);
        z-index: 25;
        display: inline-flex;
        min-height: 54px;
        padding: 0 22px;
        border-radius: 999px;
        font-size: 16px;
        box-shadow: 0 12px 30px rgba(255, 106, 42, 0.35);
      }

      body:not(.on-files) .fab, body.has-selection .fab { display: none; }

      .selection-bar {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(var(--nav-h) + var(--safe-bottom) + 12px);
        z-index: 26;
        box-shadow: var(--shadow);
      }

      .selection-bar .label-text { display: none; }

      .file-table.panel { border: 0; background: transparent; box-shadow: none; display: grid; gap: 8px; }
      .file-row {
        grid-template-columns: 28px minmax(0, 1fr) auto;
        gap: 10px;
        min-height: 64px;
        border: 1px solid var(--line-soft);
        border-radius: 12px;
        background: rgba(17, 17, 17, 0.82);
        padding: 10px 10px 10px 12px;
      }
      .file-row:last-child { border-bottom: 1px solid var(--line-soft); }
      .file-row .col-type, .file-row .col-size { display: none; }
      .file-icon { width: 38px; height: 38px; }
      .file-title { font-size: 15px; }
      .file-subtitle { font-size: 12px; }

      .pick-card { min-height: 200px; }
      .toast { bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px); }
      .drop-hint { display: none; }
    }

    @media (min-width: 781px) {
      .mobile-only { display: none !important; }
    }

    /* Hide actions the host's permission preset does not allow. */
    body.no-view .needs-view,
    body.no-upload .needs-upload,
    body.no-download .needs-download,
    body.no-create_folder .needs-create_folder,
    body.no-text .needs-text,
    body.no-streaming .needs-streaming { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <section id="login" class="login-shell">
    <div class="login stack">
      <div class="brand">
        <img class="mark" src="/logo.png" alt="" aria-hidden="true">
        <div class="brand-text">
          <strong>Erebrus Drop</strong>
          <div class="muted" id="login-room">Private Drop Room</div>
        </div>
      </div>
      <div>
        <h1>Join room</h1>
        <p class="muted" id="host-line">Enter the room password.</p>
      </div>
      <form id="login-form" class="stack">
        <input id="password" type="password" autocomplete="current-password" placeholder="Room password" enterkeyhint="go">
        <button class="primary" type="submit" id="login-button">Join</button>
        <div id="login-message" class="error" role="alert"></div>
      </form>
    </div>
  </section>

  <section id="app" class="shell hidden">
    <header class="mobile-bar">
      <div class="brand">
        <img class="mark" src="/logo.png" alt="" aria-hidden="true">

    <label class="btn primary fab needs-upload" for="upload-file"><span data-icon="plus"></span><span>Upload</span></label>
    <input id="upload-file" type="file" multiple class="hidden">
  </section>

  <div class="drop-overlay">Drop to upload</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const icons = {
      'arrow-up': '<svg viewBox="0 0 24 24"><path d="m12 19 0-14"></path><path d="m5 12 7-7 7 7"></path></svg>',
      alert: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>',
      check: '<svg viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"></path></svg>',
      'check-all': '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="m8 12 3 3 5-6"></path></svg>',
      'check-circle': '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="m8 12 3 3 5-6"></path></svg>',
      clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 7v5l3 2"></path></svg>',
      download: '<svg viewBox="0 0 24 24"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>',
      file: '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg>',
      folder: '<svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>',
      'folder-plus': '<svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M12 11v6"></path><path d="M9 14h6"></path></svg>',
      image: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="8" cy="10" r="2"></circle><path d="m21 15-5-5L5 19"></path></svg>',
      loader: '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg>',
      lock: '<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>',
      logout: '<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>',
      play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="m10 8 6 4-6 4z"></path></svg>',
      plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>',
      refresh: '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2"></path><path d="M3 12A9 9 0 0 1 18.5 5.8"></path><path d="M3 20v-6h6"></path><path d="M21 4v6h-6"></path></svg>',
      send: '<svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"></path><path d="M22 2 11 13"></path></svg>',
      text: '<svg viewBox="0 0 24 24"><path d="M4 7V4h16v3"></path><path d="M9 20h6"></path><path d="M12 4v16"></path></svg>',
      upload: '<svg viewBox="0 0 24 24"><path d="M12 21V9"></path><path d="m7 14 5-5 5 5"></path><path d="M5 3h14"></path></svg>',
      video: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="14" height="14" rx="2"></rect><path d="m17 9 4-2v10l-4-2"></path></svg>',
      x: '<svg viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>'
    };

    const demoItems = [
      { id: 'demo-folder', name: 'Trip photos', type: 'folder', path: '/Trip photos', sizeBytes: 0, mimeType: null, streamable: false },
      { id: 'demo-pdf', name: 'boarding-pass.pdf', type: 'file', path: '/boarding-pass.pdf', sizeBytes: 842120, mimeType: 'application/pdf', streamable: false },
      { id: 'demo-image', name: 'receipt-photo.png', type: 'file', path: '/receipt-photo.png', sizeBytes: 1284200, mimeType: 'image/png', streamable: false },
      { id: 'demo-video', name: 'local-movie.mp4', type: 'file', path: '/local-movie.mp4', sizeBytes: 104857600, mimeType: 'video/mp4', streamable: true }
    ];
    const DEMO_FREE_BYTES = 3 * 1024 * 1024 * 1024;

    const state = {
      room: null,
      token: '',
      path: '/',
      items: [],
      demo: false,
      selectedIds: new Set(),
      storage: null,
      upload: null,
      tab: 'files'
    };
    try { state.token = sessionStorage.getItem('dropToken') || ''; } catch (_) {}
    let storagePollTimer = null;
    let toastTimer = null;

    const $ = (id) => document.getElementById(id);
    const authHeaders = () => state.token ? { Authorization: `Bearer ${state.token}` } : {};
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[char]));

    function icon(name) {
      return icons[name] || icons.file;
    }

    function installIcons(root = document) {
      root.querySelectorAll('[data-icon]').forEach((node) => {
        node.innerHTML = icon(node.dataset.icon);
        node.style.display = 'inline-flex';
      });
    }

    function fmt(bytes) {
      if (bytes === null || bytes === undefined || bytes < 0 || !Number.isFinite(Number(bytes))) return '--';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let size = Number(bytes);
      let unit = 0;
      while (size >= 1024 && unit < units.length - 1) { size /= 1024; unit++; }
      return `${size.toFixed(unit === 0 || size >= 10 ? 0 : 1)} ${units[unit]}`;
    }

    function fmtEta(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '';
      if (seconds < 1) return 'almost done';
      const total = Math.ceil(seconds);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      if (hours > 0) return `${hours}h ${minutes}m left`;
      if (minutes > 0) return `${minutes}m ${secs}s left`;
      return `${secs}s left`;
    }

    function relativeTime(isoValue) {
      const time = Date.parse(isoValue || '');
      if (!Number.isFinite(time)) return '';
      const seconds = Math.max(0, Math.round((Date.now() - time) / 1000));
      if (seconds < 10) return 'just now';
      if (seconds < 60) return `${seconds}s ago`;
      const minutes = Math.round(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      return `${Math.round(minutes / 60)}h ago`;
    }

    function toast(message, { bad = false } = {}) {
      const node = $('toast');
      node.textContent = message;
      node.classList.toggle('bad', bad);
      node.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => node.classList.remove('show'), bad ? 5200 : 2600);
    }

    function setNotice(kind, message) {
      const node = $('upload-status');
      if (!message) {
        node.classList.add('hidden');
        return;
      }
      node.className = `notice ${kind}`;
      node.innerHTML = `${icon(kind === 'good' ? 'check-circle' : 'alert')}<span>${escapeHtml(message)}</span>`;
    }

    function isFolderScanActive(status) {
      return status === 'queued' || status === 'scanning';
    }

    function scheduleStoragePoll(active) {
      if (storagePollTimer) {
        clearTimeout(storagePollTimer);
        storagePollTimer = null;
      }
      if (!active) return;
      storagePollTimer = setTimeout(() => {
        storagePollTimer = null;
        loadStorage().catch(() => {});
      }, 2800);
    }

    class RequestError extends Error {
      constructor(message, status) {
        super(message);
        this.status = status;
      }
    }

    async function request(url, options = {}) {
      if (state.demo) return demoRequest(url, options);
      let response;
      try {
        response = await fetch(url, {
          ...options,
          headers: { ...(options.headers || {}), ...authHeaders() }
        });
      } catch (_) {
        throw new RequestError('Lost connection to the room. Check Wi-Fi and that the host app is open.', 0);
      }
      const contentType = response.headers.get('content-type') || '';
      const data = contentType.includes('application/json') ? await response.json() : await response.text();
      if (response.status === 401 && state.room && !url.includes('/api/auth/login')) {
        sessionExpired();
      }
      if (!response.ok) throw new RequestError(data.error || 'Request failed', response.status);
      return data;
    }

    async function demoRequest(url, options = {}) {
      await new Promise((resolve) => setTimeout(resolve, 120));
      if (url.includes('/api/storage')) {
        return {
          dropUsedBytes: 167772160,
          roomUsedBytes: 107479040,
          availableBytes: DEMO_FREE_BYTES,
          totalBytes: 128849018880,
          maxUploadBytes: 2147483648,
          folderUsedBytes: 107479040,
          folderScanStatus: 'ready',
          folderScannedAt: new Date(Date.now() - 95000).toISOString(),
          folderScanMessage: 'Scanned 12 files in 4 folders.',
          lowStorage: false
        };
      }
      if (url.includes('/api/files/upload/check')) {
        const files = JSON.parse(options.body || '{}').files || [];
        const total = files.reduce((sum, file) => sum + file.size, 0);
        return total > DEMO_FREE_BYTES
          ? { ok: false, error: `The host device has only ${fmt(DEMO_FREE_BYTES)} free. This needs ${fmt(total)}. Free up space or pick fewer files.` }
          : { ok: true };
      }
      if (url.includes('/api/files?')) {
        const requested = state.path === '/' && inScopedMode() ? scopeRoot() : state.path;
        const visible = requested === '/'
          ? demoItems.filter((item) => item.path.split('/').length === 2)
          : demoItems.filter((item) => item.path.startsWith(`${requested}/`));
        return { path: requested, items: visible };
      }
      if (url.includes('/api/folders')) {
        const body = JSON.parse(options.body || '{}');
        const name = (body.path || '/New Folder').split('/').filter(Boolean).pop();
        demoItems.unshift({ id: `demo-${Date.now()}`, name, type: 'folder', path: body.path, sizeBytes: 0, mimeType: null, streamable: false });
        return { ok: true };
      }
      return { ok: true };
    }

    async function boot() {
      try {
        const response = await fetch('/api/room');
        if (!response.ok) throw new Error('not a room');
        state.room = await response.json();
        if (!state.room || !state.room.roomId) throw new Error('not a room');
      } catch (_) {
        startDemoMode();
        return;
      }
      $('login-room').textContent = state.room.roomName;
      $('host-line').textContent = state.room.authRequired
        ? `Hosted by ${state.room.deviceName}. Enter the room password.`
        : `Hosted by ${state.room.deviceName}.`;
      if (!state.room.authRequired) {
        await login('');
      } else if (state.token) {
        showApp();
      } else {
        $('password').focus();
      }
    }

    function startDemoMode() {
      state.demo = true;
      state.token = 'demo-token';
      state.room = {
        roomName: 'Preview Drop Room',
        deviceName: 'Preview',
        authRequired: false,
        defaultUploadPath: '/',
        scopedToDefaultFolder: true,
        scopePath: '/',
        storageSource: 'external',
        hostFolderName: 'ErebrusDrop'
      };
      showApp();
      addActivity('Preview mode with sample files.');
    }

    async function login(password) {
      const data = await request('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      state.token = data.token;
      try { sessionStorage.setItem('dropToken', data.token); } catch (_) {}
      showApp();
    }

    function sessionExpired() {
      if (!state.token) return;
      state.token = '';
      try { sessionStorage.removeItem('dropToken'); } catch (_) {}
      if (!state.room.authRequired) {
        login('').catch(() => location.reload());
        return;
      }
      $('app').classList.add('hidden');
      $('login').classList.remove('hidden');
      $('login-message').textContent = 'Your session ended. Enter the password again.';
      $('password').focus();
    }

    const ALL_CAPABILITIES = ['view', 'upload', 'download', 'create_folder', 'text', 'streaming'];

    function can(capability) {
      const granted = state.room?.permissions || ALL_CAPABILITIES;
      return granted.includes(capability) || (capability === 'streaming' && granted.includes('download'));
    }

    function applyPermissions() {
      ALL_CAPABILITIES.forEach((capability) => {
        document.body.classList.toggle(`no-${capability}`, !can(capability));
      });
      if (!can('view') && state.tab !== 'text') state.tab = can('upload') ? 'upload' : 'text';
    }

    function showApp() {
      applyPermissions();
      $('login').classList.add('hidden');
      $('app').classList.remove('hidden');
      $('room-name').textContent = state.room.roomName;
      $('mobile-room-name').textContent = state.room.roomName;
      $('device-name').textContent = `Hosted by ${state.room.deviceName}`;
      $('mobile-device-name').textContent = state.room.deviceName;
      document.title = `${state.room.roomName} · Erebrus Drop`;
      $('session-text').innerHTML = state.room.authRequired
        ? `${icon('lock')} Password-protected room. Your session lasts while the room is open (up to 2 hours).`
        : 'Open room on this network.';
      showView(state.tab);
      renderFolderShortcuts();
      refreshUploadTarget();
      refreshAll();
    }

    async function refreshAll() {
      try {
        await Promise.all([can('view') ? loadFiles() : Promise.resolve(), loadStorage()]);
      } catch (error) {
        toast(error.message, { bad: true });
      }
      renderMedia();
    }

    async function loadFiles() {
      const data = await request(`/api/files?path=${encodeURIComponent(state.path)}`);
      state.path = data.path;
      state.items = data.items || [];
      pruneSelection();
      renderBreadcrumbs();
      renderFiles();
      renderFolderShortcuts();
      refreshUploadTarget();
      renderMedia();
    }

    function openPath(path) {
      state.path = path;
      loadFiles().catch((error) => toast(error.message, { bad: true }));
    }

    function defaultUploadPath() {
      return state.room?.defaultUploadPath || '/';
    }

    function scopeRoot() {
      return state.room?.scopedToDefaultFolder
        ? (state.room.scopePath || defaultUploadPath())
        : '/';
    }

    function inScopedMode() {
      return state.room?.scopedToDefaultFolder === true;
    }

    function uploadTargetPath() {
      return state.path === '/' ? defaultUploadPath() : state.path;
    }

    function joinPath(base, suffix) {
      const left = base === '/' ? '' : base.replace(/\/+$/, '');
      const right = suffix.startsWith('/') ? suffix : `/${suffix}`;
      return `${left}${right}` || '/';
    }

    function dropFolderName() {
      return state.room?.hostFolderName || 'Drop folder';
    }

    function displayPath(path) {
      const scope = scopeRoot();
      if (!inScopedMode()) return path === '/' ? 'Room' : path;
      const rest = path.startsWith(scope) ? path.substring(scope.length) : path;
      return rest && rest !== '/' ? `${dropFolderName()}${rest.startsWith('/') ? rest : `/${rest}`}` : dropFolderName();
    }

    function refreshUploadTarget() {
      $('upload-target').textContent = displayPath(uploadTargetPath());
    }

    function renderBreadcrumbs() {
      const scope = scopeRoot();
      const scoped = inScopedMode();
      const label = scoped ? dropFolderName() : 'Room';
      const pathForParts = scoped && state.path.startsWith(scope)
        ? state.path.substring(scope.length)
        : state.path;
      const parts = pathForParts.split('/').filter(Boolean);
      const buttons = [`<button class="crumb-button${parts.length ? '' : ' current'}" data-path="${escapeHtml(scope)}">${escapeHtml(label)}</button>`];
      parts.forEach((part, index) => {
        const suffix = `/${parts.slice(0, index + 1).join('/')}`;
        const path = scoped ? joinPath(scope, suffix) : suffix;
        const current = index === parts.length - 1 ? ' current' : '';
        buttons.push(`<span class="faint">/</span><button class="crumb-button${current}" data-path="${escapeHtml(path)}">${escapeHtml(part)}</button>`);
      });
      $('breadcrumbs').innerHTML = buttons.join('');
      $('breadcrumbs').querySelectorAll('[data-path]').forEach((button) => {
        button.addEventListener('click', () => openPath(button.dataset.path));
      });
      $('breadcrumbs').scrollLeft = $('breadcrumbs').scrollWidth;
      $('up-folder').disabled = state.path === scope || state.path === '/';
    }

    function renderFolderShortcuts() {
      $('folder-shortcuts').innerHTML = `<h3>Drop folder</h3>
        <button class="folder-link" data-path="${escapeHtml(scopeRoot())}">
          ${icon('folder')}<span>${escapeHtml(dropFolderName())}</span>
        </button>`;
      $('folder-shortcuts').querySelectorAll('[data-path]').forEach((item) => {
        item.addEventListener('click', () => {
          showView('files');
          openPath(item.dataset.path);
        });
      });
    }

    function itemIcon(item) {
      if (item.type === 'folder') return 'folder';
      const mime = item.mimeType || '';
      if (mime.startsWith('image/')) return 'image';
      if (mime.startsWith('video/') || mime.startsWith('audio/')) return 'video';
      if (mime.startsWith('text/')) return 'text';
      return 'file';
    }

    function displayType(item) {
      if (item.type === 'folder') return 'Folder';
      const mime = (item.mimeType || '').split(';')[0].trim().toLowerCase();
      const ext = (item.name.split('.').pop() || '').toLowerCase();
      if (mime.startsWith('image/')) return 'Image';
      if (mime.startsWith('video/')) return 'Video';
      if (mime.startsWith('audio/')) return 'Audio';
      if (mime === 'text/plain') return 'Text';
      if (mime === 'application/pdf') return 'PDF';
      if (mime === 'application/json') return 'JSON';
      if (mime === 'application/zip') return 'ZIP';
      if (['doc', 'docx'].includes(ext)) return 'Document';
      if (['xls', 'xlsx', 'csv'].includes(ext)) return 'Sheet';
      if (['ppt', 'pptx'].includes(ext)) return 'Slides';
      return 'File';
    }

    function selectedItems() {
      return state.items.filter((item) => item.type !== 'folder' && state.selectedIds.has(item.id));
    }

    function pruneSelection() {
      const visibleIds = new Set(state.items.filter((item) => item.type !== 'folder').map((item) => item.id));
      Array.from(state.selectedIds).forEach((id) => {
        if (!visibleIds.has(id)) state.selectedIds.delete(id);
      });
    }

    function updateSelectionBar() {
      const files = selectedItems();
      const count = files.length;
      $('selection-bar').classList.toggle('hidden', count === 0);
      document.body.classList.toggle('has-selection', count > 0);
      $('selection-count').textContent = `${count} selected`;
      $('selection-size').textContent = count ? ` · ${fmt(files.reduce((sum, item) => sum + (item.sizeBytes || 0), 0))}` : '';
      const fileCount = state.items.filter((item) => item.type !== 'folder').length;
      $('select-visible').disabled = fileCount === 0;
    }

    function fileUrl(item, action) {
      return `/api/files/${encodeURIComponent(item.id)}/${action}?token=${encodeURIComponent(state.token)}`;
    }

    function renderFiles() {
      if (!state.items.length) {
        $('files').innerHTML = `
          <div class="empty">
            <div class="file-icon folder" style="width: 56px; height: 56px;">${icon('folder')}</div>
            <div>
              <strong>No files here yet</strong>
              <div class="muted">Files you upload will show up here.</div>
            </div>
            <label class="btn primary needs-upload" for="upload-file">${icon('upload')}<span>Upload files</span></label>
          </div>`;
        updateSelectionBar();
        return;
      }

      $('files').innerHTML = state.items.map((item) => {
        const isFolder = item.type === 'folder';
        const selected = state.selectedIds.has(item.id);
        const name = escapeHtml(item.name);
        const subtitle = isFolder ? 'Folder' : `${displayType(item)} · ${fmt(item.sizeBytes)}`;
        const action = isFolder
          ? `<a class="btn icon-btn needs-download" href="/api/files/${encodeURIComponent(item.id)}/bundle?token=${encodeURIComponent(state.token)}&name=${encodeURIComponent(item.name)}" title="Download folder as ZIP" aria-label="Download ${name} as ZIP" data-stop>${icon('download')}</a>`
          : `<a class="btn icon-btn needs-download" href="${fileUrl(item, 'download')}" download="${name}" title="Download" aria-label="Download ${name}" data-stop>${icon('download')}</a>`;
        return `
          <div class="file-row${selected ? ' selected' : ''}" data-row="${escapeHtml(item.id)}">
            <div>
              ${isFolder
                ? '<span class="select-placeholder"></span>'
                : `<button class="select-btn needs-download${selected ? ' active' : ''}" data-select="${escapeHtml(item.id)}" aria-pressed="${selected}" aria-label="Select ${name}" data-stop>${selected ? icon('check') : ''}</button>`}
            </div>
            <div class="file-main">
              <div class="file-icon${isFolder ? ' folder' : ''}">${icon(itemIcon(item))}</div>
              <div class="file-meta">
                <span class="file-title">${name}</span>
                <div class="file-subtitle">${escapeHtml(subtitle)}</div>
              </div>
            </div>
            <div class="col-type"><span class="pill">${escapeHtml(displayType(item))}</span></div>
            <div class="col-size muted">${isFolder ? '-' : fmt(item.sizeBytes)}</div>
            <div class="actions">${action}</div>
          </div>`;
      }).join('');

      const byId = new Map(state.items.map((item) => [item.id, item]));
      $('files').querySelectorAll('[data-row]').forEach((row) => {
        row.addEventListener('click', (event) => {
          if (event.target.closest('[data-stop]') && !event.target.closest('[data-select]')) return;
          const item = byId.get(row.dataset.row);
          if (!item) return;
          if (item.type === 'folder') {
            openPath(item.path);
            return;
          }
          if (!can('download')) return;
          if (state.selectedIds.has(item.id)) {
            state.selectedIds.delete(item.id);
          } else {
            state.selectedIds.add(item.id);
          }
          renderFiles();
        });
      });
      $('files').querySelectorAll('a[data-stop]').forEach((link) => {
        link.addEventListener('click', () => addActivity(`Downloading ${link.getAttribute('aria-label').replace(/^Download /, '')}`));
      });
      updateSelectionBar();
    }

    function renderMedia() {
      const media = state.items.filter((item) => item.streamable);
      $('media').innerHTML = media.length ? media.map((item) => {
        const url = fileUrl(item, 'stream');
        const isAudio = (item.mimeType || '').startsWith('audio/');
        const player = isAudio
          ? `<audio controls preload="none" src="${url}"></audio>`
          : `<video controls playsinline preload="metadata" src="${url}#t=0.1"></video>`;
        return `
          <div class="media-card">
            ${player}
            <div>
              <strong>${escapeHtml(item.name)}</strong>
              <div class="muted">${escapeHtml(displayType(item))} · ${fmt(item.sizeBytes)}</div>
            </div>
          </div>`;
      }).join('') : `
        <div class="empty panel" style="grid-column: 1 / -1;">
          <div class="file-icon" style="width: 56px; height: 56px;">${icon('play')}</div>
          <div>
            <strong>No videos or music here</strong>
            <div class="muted">Open a folder with audio or video in Files.</div>
          </div>
        </div>`;
    }

    async function loadStorage() {
      const storage = await request('/api/storage');
      state.storage = storage;
      const free = storage.availableBytes;
      const total = storage.totalBytes || 0;
      const external = state.room?.storageSource === 'external';
      const scanStatus = storage.folderScanStatus || 'unavailable';
      const folderUsed = typeof storage.folderUsedBytes === 'number' ? storage.folderUsedBytes : null;
      const scanActive = external && isFolderScanActive(scanStatus);
      const used = external ? folderUsed : storage.roomUsedBytes;
      const usedPct = typeof free === 'number' && total > 0 ? Math.min(100, Math.round(((total - free) / total) * 100)) : 0;
      $('storage-ring').style.setProperty('--pct', `${usedPct * 3.6}deg`);
      $('storage-percent').textContent = fmt(free);
      $('storage-ring-label').textContent = 'free';
      $('free-space').textContent = fmt(free);
      $('total-space').textContent = fmt(storage.totalBytes);
      $('max-upload').textContent = fmt(storage.maxUploadBytes);
      $('room-used').textContent = used !== null && used !== undefined ? fmt(used) : scanActive ? '...' : '--';
      $('room-used-label').textContent = external ? dropFolderName() : 'In room';
      const scannedAgo = relativeTime(storage.folderScannedAt);
      $('storage-text').textContent = storage.lowStorage
        ? 'The host is low on space. Large uploads may not fit.'
        : external && scannedAgo ? `Folder size checked ${scannedAgo}.` : '';
      const freeLabel = typeof free === 'number' ? `${fmt(free)} free` : 'Space unknown';
      for (const id of ['mobile-free', 'upload-free']) {
        const chip = $(id);
        chip.textContent = freeLabel;
        chip.classList.toggle('warn', Boolean(storage.lowStorage));
      }
      scheduleStoragePoll(scanActive);
    }

    function addActivity(text) {
      const node = document.createElement('div');
      node.className = 'activity-item';
      node.innerHTML = `${icon('clock')}<span>${escapeHtml(text)}</span>`;
      $('activity').prepend(node);
      while ($('activity').children.length > 5) $('activity').lastElementChild.remove();
    }

    // ---------------- Uploads ----------------

    function renderQueue() {
      const upload = state.upload || state.lastUpload;
      if (!upload) {
        $('upload-queue').innerHTML = '';
        return;
      }
      const iconFor = { waiting: 'clock', active: 'loader', done: 'check-circle', failed: 'alert', skipped: 'x' };
      $('upload-queue').innerHTML = upload.files.map((entry) => `
        <div class="queue-item ${entry.status}">
          ${icon(iconFor[entry.status])}
          <span class="name">${escapeHtml(entry.file.name)}</span>
          <span class="muted">${fmt(entry.file.size)}</span>
        </div>`).join('');
    }

    function setUploadProgress({ title, sent, total, speed }) {
      const progress = total > 0 ? Math.min(100, Math.floor((sent / total) * 100)) : 0;
      $('upload-progress').classList.remove('hidden');
      $('upload-progress-title').textContent = title;
      $('upload-progress-percent').textContent = `${progress}%`;
      $('upload-progress-fill').style.width = `${progress}%`;
      const eta = speed > 0 && total > sent ? fmtEta((total - sent) / speed) : '';
      $('upload-progress-detail').textContent = [
        `${fmt(sent)} of ${fmt(total)}`,
        speed > 0 ? `${fmt(speed)}/s` : '',
        eta
      ].filter(Boolean).join(' · ');
    }

    async function preflightUpload(files) {
      const data = await request('/api/files/upload/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ files: files.map((file) => ({ name: file.name, size: file.size })) })
      });
      return data.ok === false ? (data.error || 'These files will not fit on the host.') : null;
    }

    function uploadOne(entry, target, onProgress) {
      return new Promise((resolve, reject) => {
        if (state.demo) {
          let sent = 0;
          const step = Math.max(entry.file.size / 8, 1);
          const timer = setInterval(() => {
            if (state.upload?.cancelled) {
              clearInterval(timer);
              reject(new RequestError('Upload cancelled.', -1));
              return;
            }
            sent = Math.min(entry.file.size, sent + step);
            onProgress(sent);
            if (sent >= entry.file.size) {
              clearInterval(timer);
              resolve();
            }
          }, 90);
          return;
        }
        const xhr = new XMLHttpRequest();
        state.upload.xhr = xhr;
        const url = `/api/files/upload?path=${encodeURIComponent(target)}&name=${encodeURIComponent(entry.file.name)}`;
        xhr.open('POST', url);
        if (state.token) xhr.setRequestHeader('Authorization', `Bearer ${state.token}`);
        xhr.setRequestHeader('Content-Type', entry.file.type || 'application/octet-stream');
        xhr.upload.onprogress = (event) => onProgress(event.lengthComputable ? event.loaded : 0);
        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve();
            return;
          }
          let message = 'Upload failed.';
          try {
            message = JSON.parse(xhr.responseText || '{}').error || message;
          } catch (_) {}
          if (xhr.status === 401) sessionExpired();
          reject(new RequestError(message, xhr.status));
        };
        xhr.onerror = () => reject(new RequestError('The connection dropped during upload.', 0));
        xhr.onabort = () => reject(new RequestError('Upload cancelled.', -1));
        xhr.send(entry.file);
      });
    }

    async function explainNetworkFailure(remainingBytes) {
      // A host that runs out of space closes the connection mid-upload, which
      // the browser reports as a network error. Check storage to say which.
      try {
        await loadStorage();
        const free = state.storage?.availableBytes;
        if (typeof free === 'number' && free < remainingBytes + 64 * 1024 * 1024) {
          return 'The host ran out of storage. Free up space on the host and try again.';
        }
      } catch (_) {
        return 'Lost connection to the room. Check Wi-Fi and that the host app is open.';
      }
      return 'The connection dropped during upload. Check Wi-Fi and try again.';
    }

    async function uploadFiles(fileList) {
      const files = Array.from(fileList || []);
      $('upload-file').value = '';
      if (!files.length) return;
      if (state.upload) {
        toast('An upload is already running.', { bad: true });
        return;
      }
      showView('upload');
      const target = uploadTargetPath();
      const totalBytes = files.reduce((sum, file) => sum + file.size, 0);
      state.upload = {
        files: files.map((file) => ({ file, status: 'waiting' })),
        cancelled: false,
        xhr: null
      };
      $('drop-zone').classList.add('busy');
      setNotice(null, '');
      renderQueue();
      setUploadProgress({ title: 'Checking space...', sent: 0, total: totalBytes, speed: 0 });

      let problem = null;
      try {
        problem = await preflightUpload(files);
      } catch (error) {
        if (error.status === 401) {
          finishUpload();
          return;
        }
        problem = error.status === 0 ? error.message : null;
      }
      if (problem) {
        state.upload.files.forEach((entry) => { entry.status = 'skipped'; });
        finishUpload();
        $('upload-progress').classList.add('hidden');
        setNotice('bad', problem);
        return;
      }

      const startedAt = performance.now();
      let sentBefore = 0;
      let done = 0;
      try {
        for (let index = 0; index < state.upload.files.length; index++) {
          const entry = state.upload.files[index];
          if (state.upload.cancelled) break;
          entry.status = 'active';
          renderQueue();
          const title = files.length === 1 ? `Uploading ${entry.file.name}` : `Uploading ${index + 1} of ${files.length}`;
          await uploadOne(entry, target, (sent) => {
            const overall = sentBefore + sent;
            const elapsed = Math.max((performance.now() - startedAt) / 1000, 0.001);
            setUploadProgress({ title, sent: overall, total: totalBytes, speed: overall / elapsed });
          });
          entry.status = 'done';
          done++;
          sentBefore += entry.file.size;
          renderQueue();
        }
        $('upload-progress').classList.add('hidden');
        setNotice('good', `Uploaded ${done} file${done === 1 ? '' : 's'} to ${displayPath(target)}.`);
        addActivity(`Uploaded ${done} file${done === 1 ? '' : 's'}`);
        toast(`Uploaded ${done} file${done === 1 ? '' : 's'}`);
      } catch (error) {
        const active = state.upload.files.find((entry) => entry.status === 'active');
        if (active) active.status = error.status === -1 ? 'skipped' : 'failed';
        state.upload.files.forEach((entry) => { if (entry.status === 'waiting') entry.status = 'skipped'; });
        $('upload-progress').classList.add('hidden');
        let message = error.message;
        if (error.status === -1) {
          message = done ? `Cancelled. ${done} file${done === 1 ? ' was' : 's were'} uploaded.` : 'Upload cancelled.';
        } else if (error.status === 0) {
          message = await explainNetworkFailure(totalBytes - sentBefore);
        }
        setNotice(error.status === -1 ? 'info' : 'bad', message);
      } finally {
        finishUpload();
        if (done) refreshAll();
        else loadStorage().catch(() => {});
      }
    }

    function finishUpload() {
      state.lastUpload = state.upload;
      state.upload = null;
      $('drop-zone').classList.remove('busy');
      renderQueue();
    }

    function cancelUpload() {
      if (!state.upload) return;
      state.upload.cancelled = true;
      state.upload.xhr?.abort();
    }

    // ---------------- Downloads ----------------

    function downloadSelectedFiles() {
      const files = selectedItems();
      if (!files.length) return;
      const link = document.createElement('a');
      if (files.length === 1) {
        link.href = fileUrl(files[0], 'download');
        link.download = files[0].name;
        addActivity(`Downloading ${files[0].name}`);
      } else {
        const params = new URLSearchParams();
        if (state.token) params.set('token', state.token);
        params.set('name', 'erebrus-drop-selection');
        files.forEach((file) => params.append('id', file.id));
        link.href = `/api/files/bundle?${params.toString()}`;
        link.download = 'erebrus-drop-selection.zip';
        addActivity(`Downloading ${files.length} files as ZIP`);
        toast(`Preparing a ZIP of ${files.length} files...`);
      }
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    // ---------------- Navigation ----------------

    function showView(tab) {
      state.tab = tab;
      document.querySelectorAll('[data-tab]').forEach((item) => {
        const active = item.dataset.tab === tab;
        item.classList.toggle('active', active);
        item.setAttribute('aria-current', active ? 'page' : 'false');
      });
      document.querySelectorAll('.view').forEach((view) => view.classList.add('hidden'));
      $(`view-${tab}`).classList.remove('hidden');
      document.body.classList.toggle('on-files', tab === 'files');
      refreshUploadTarget();
      window.scrollTo({ top: 0 });
    }

    document.querySelectorAll('[data-tab]').forEach((tab) => {
      tab.addEventListener('click', () => showView(tab.dataset.tab));
    });

    // ---------------- Events ----------------

    $('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      $('login-message').textContent = '';
      $('login-button').disabled = true;
      try {
        await login($('password').value);
        $('password').value = '';
      } catch (error) {
        $('login-message').textContent = error.message;
      } finally {
        $('login-button').disabled = false;
      }
    });

    $('open-upload-target').addEventListener('click', () => {
      if (!can('view')) return;
      showView('files');
      openPath(uploadTargetPath());
    });

    $('up-folder').addEventListener('click', () => {
      if (state.path === '/') return;
      const parts = state.path.split('/').filter(Boolean);
      parts.pop();
      const nextPath = parts.length ? `/${parts.join('/')}` : '/';
      const scope = scopeRoot();
      openPath(inScopedMode() && (nextPath === '/' || !nextPath.startsWith(scope)) ? scope : nextPath);
    });

    $('refresh-files').addEventListener('click', refreshAll);
    $('select-visible').addEventListener('click', () => {
      const files = state.items.filter((item) => item.type !== 'folder');
      const allSelected = files.length > 0 && files.every((item) => state.selectedIds.has(item.id));
      files.forEach((item) => {
        if (allSelected) state.selectedIds.delete(item.id);
        else state.selectedIds.add(item.id);
      });
      renderFiles();
    });
    $('download-selected').addEventListener('click', downloadSelectedFiles);
    $('clear-selection').addEventListener('click', () => {
      state.selectedIds.clear();
      renderFiles();
    });

    function toggleNewFolder(show) {
      $('new-folder-form').classList.toggle('hidden', !show);
      if (show) $('folder-name').focus();
      else $('folder-name').value = '';
    }

    $('show-new-folder').addEventListener('click', () => toggleNewFolder($('new-folder-form').classList.contains('hidden')));
    $('cancel-new-folder').addEventListener('click', () => toggleNewFolder(false));
    $('new-folder-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const name = $('folder-name').value.trim();
      if (!name) return;
      if (/[\\/]/.test(name) || name === '.' || name === '..') {
        toast('Folder names cannot contain / or \\', { bad: true });
        return;
      }
      try {
        await request('/api/folders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: joinPath(state.path, name) })
        });
        addActivity(`Created folder ${name}`);
        toast(`Created ${name}`);
        toggleNewFolder(false);
        refreshAll();
      } catch (error) {
        toast(error.message, { bad: true });
      }
    });

    $('upload-file').addEventListener('change', () => uploadFiles($('upload-file').files));
    $('cancel-upload').addEventListener('click', cancelUpload);

    // Drag and drop anywhere on the page (desktop browsers).
    let dragDepth = 0;
    const hasFiles = (event) => Array.from(event.dataTransfer?.types || []).includes('Files');
    document.addEventListener('dragenter', (event) => {
      if (!hasFiles(event) || $('app').classList.contains('hidden')) return;
      event.preventDefault();
      dragDepth++;
      document.body.classList.add('dragging');
    });
    document.addEventListener('dragover', (event) => {
      if (hasFiles(event)) event.preventDefault();
    });
    document.addEventListener('dragleave', () => {
      dragDepth = Math.max(0, dragDepth - 1);
      if (!dragDepth) document.body.classList.remove('dragging');
    });
    document.addEventListener('drop', (event) => {
      if (!hasFiles(event)) return;
      event.preventDefault();
      dragDepth = 0;
      document.body.classList.remove('dragging');
      if ($('app').classList.contains('hidden')) return;
      uploadFiles(event.dataTransfer.files);
    });

    $('text-body').addEventListener('input', () => {
      $('send-text').disabled = !$('text-body').value.trim();
    });
    $('text-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const body = $('text-body').value;
      if (!body.trim()) return;
      const title = $('text-title').value.trim() || body.trim().split('\n')[0].slice(0, 40).trim() || 'Note';
      $('send-text').disabled = true;
      try {
        await request('/api/text', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, body, source: 'browser' })
        });
        $('text-body').value = '';
        $('text-title').value = '';
        toast('Sent to the room');
        addActivity(`Sent text: ${title}`);
        refreshAll();
      } catch (error) {
        toast(error.message, { bad: true });
        $('send-text').disabled = false;
      }
    });

    function logout() {
      if (state.upload && !confirm('An upload is running. Leave anyway?')) return;
      cancelUpload();
      try { sessionStorage.removeItem('dropToken'); } catch (_) {}
      location.reload();
    }
    $('logout').addEventListener('click', logout);
    $('mobile-logout').addEventListener('click', logout);

    window.addEventListener('beforeunload', (event) => {
      if (!state.upload) return;
      event.preventDefault();
      event.returnValue = '';
    });

    // Phones pause background tabs; refresh when the page comes back.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && state.token && !state.upload && !$('app').classList.contains('hidden')) {
        refreshAll();
      }
    });

    installIcons();
    boot().catch((error) => {
      $('login-message').textContent = error.message;
    });
  </script>
</body>
</html>
